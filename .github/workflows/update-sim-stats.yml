name: Update JBL Sim Stats

on:
  schedule:
    # 毎日 15:00 UTC = 0:00 JST / 11:00 EST
    - cron: '0 15 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Jojistats-app
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout BaseballEngine
        uses: actions/checkout@v4
        with:
          repository: Jojicoder/BaseballEngine
          path: engine

      - name: Install build dependencies
        run: sudo apt-get install -y g++ make

      - name: Build JojiSeasonRunner
        working-directory: engine/app
        run: make season CXX=g++ SEASON_CXXFLAGS="-std=c++17 -O3 -Wall -Wextra -Wpedantic -I../include -pthread"

      - name: Generate sim-stats.json
        run: |
          engine/build/JojiSeasonRunner 100 --json > public/sim-stats.json
          echo "Generated sim-stats.json ($(wc -c < public/sim-stats.json) bytes)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sim-stats.json
          git diff --staged --quiet || git commit -m "auto: update JBL sim stats $(date -u '+%Y-%m-%d')"
          git push
