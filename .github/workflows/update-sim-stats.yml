name: Update JBL Sim Stats

on:
  schedule:
    # 毎日 15:00 UTC = 0:00 JST / 11:00 EST
    - cron: '0 15 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Jojistats-app
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout BaseballEngine
        uses: actions/checkout@v4
        with:
          repository: Jojicoder/BaseballEngine
          path: engine

      - name: Install build dependencies
        run: sudo apt-get install -y g++ make

      - name: Build binaries
        working-directory: engine/app
        run: |
          make season CXX=g++ SEASON_CXXFLAGS="-std=c++17 -O3 -Wall -Wextra -Wpedantic -I../include -pthread"
          make game-export CXX=g++ CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -I../include"

      - name: Generate JSON files
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          engine/build/JojiSeasonRunner 100 --json > public/sim-stats.json
          echo "sim-stats.json: $(wc -c < public/sim-stats.json) bytes"
          mkdir -p public/games
          engine/build/JojiGameExport > public/games/game-$DATE.json
          echo "game-$DATE.json: $(wc -c < public/games/game-$DATE.json) bytes"
          ls public/games/game-*.json | sed 's|public/games/game-||;s|\.json||' | sort -r \
            | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().split()))" \
            > public/games/index.json

      - name: Commit and push
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sim-stats.json public/games/
          git diff --staged --quiet || git commit -m "auto: JBL daily update $DATE"
          git push
