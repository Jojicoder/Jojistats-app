name: Update JBL Season JSON

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-jbl-season.yml"
      - "docs/jbl-season-json.md"
      - "scripts/validate-jbl-json.mjs"
      - "scripts/compress-jbl-json.mjs"
      - "scripts/build-jbl-stats.mjs"
      - "src/sim/jblJsonTypes.ts"
      - "package.json"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to export"
        required: true
        default: "2027"
      engine_ref:
        description: "BaseballEngine branch/tag/SHA"
        required: false
        default: "main"
      mode:
        description: "incremental = continue from last exported day, rebuild = regenerate the full season from scratch"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - rebuild
      through:
        description: "incremental only: export games through this date (YYYY-MM-DD). Blank = today."
        required: false
        default: ""
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

# One update at a time: a manual run started while the daily one is still going waits its turn.
concurrency:
  group: update-jbl-season
  cancel-in-progress: false

jobs:
  update-season:
    runs-on: ubuntu-latest

    env:
      SEASON: ${{ inputs.season || '2027' }}
      MODE: ${{ inputs.mode || 'incremental' }}
      THROUGH: ${{ inputs.through }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout BaseballEngine
        uses: actions/checkout@v4
        with:
          repository: Jojicoder/BaseballEngine
          ref: ${{ inputs.engine_ref || 'main' }}
          path: engine

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Build C++ exporters
        working-directory: engine/app
        run: |
          make game-export draft CXX=g++ CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -I../include"

      # Push events only validate that the exporter still builds and runs —
      # they write to a scratch directory so a workflow-file tweak can never
      # clobber the real, already-published season data.
      - name: Smoke-test exporter
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)/season-smoke-test"
          DRAFT_ARGS=()
          if [ "${SEASON}" -ge 2027 ]; then DRAFT_ARGS+=(--draft); fi
          engine/build/JojiGameExport --season "${SEASON}" "${DRAFT_ARGS[@]}" --all-games --limit 3 --out-dir "${TMP_DIR}"
          engine/build/JojiDraftRunner --season "${SEASON}" --seed "${SEASON}" --rounds 7 --out-dir "${TMP_DIR}"
          JBL_JSON_ROOT="${TMP_DIR}" node scripts/validate-jbl-json.mjs "${SEASON}"

      - name: Export season and detailed games
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          OUT_DIR="public/jbl/seasons/${SEASON}"
          mkdir -p "${OUT_DIR}"

          # rebuild = wipe whatever's exported so far and re-run --incremental
          # from a clean directory. --all-games has no --through bound, so
          # using it here used to dump the *entire* season (including
          # months of "future" games) in one shot instead of stopping at
          # today/THROUGH like every other run does.
          if [ "${MODE}" = "rebuild" ]; then
            rm -rf "${OUT_DIR}"
            mkdir -p "${OUT_DIR}"
          fi

          THROUGH_ARGS=()
          if [ -n "${THROUGH}" ]; then
            THROUGH_ARGS+=(--through "${THROUGH}")
          fi

          # From 2027 the season is played after the offseason draft. The draft is seeded
          # by the season year, and game export and the draft export both use that seed,
          # so the published draft always matches the rosters the games were played with.
          DRAFT_ARGS=()
          if [ "${SEASON}" -ge 2027 ]; then
            DRAFT_ARGS+=(--draft)
            engine/build/JojiDraftRunner --season "${SEASON}" --seed "${SEASON}" --rounds 7 --out-dir "${OUT_DIR}"
          fi

          engine/build/JojiGameExport --season "${SEASON}" "${DRAFT_ARGS[@]}" --incremental --out-dir "${OUT_DIR}" "${THROUGH_ARGS[@]}"

          # Game files are committed gzip-compressed (~11x smaller). The script verifies each
          # file round-trips before removing the plain copy, and skips already-compressed ones.
          node scripts/compress-jbl-json.mjs "${SEASON}"
          # Season totals for the Leaders tab and awards (skipped before the first game exists).
          if [ -f "${OUT_DIR}/season.json" ]; then node scripts/build-jbl-stats.mjs "${SEASON}"; fi

      - name: Validate JBL JSON
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          # Before Opening Day only the draft is published; there is no season.json yet.
          if [ ! -f "public/jbl/seasons/${SEASON}/season.json" ]; then
            echo "Season ${SEASON} has not started yet; skipping season validation."
            exit 0
          fi
          node scripts/validate-jbl-json.mjs "${SEASON}"

      - name: Build frontend
        run: npm ci && npm run build

      - name: Commit and push JSON update
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "public/jbl/seasons/${SEASON}" || true
          if git diff --staged --quiet; then
            echo "No JBL JSON changes to commit."
            exit 0
          fi
          git commit -m "auto: JBL ${SEASON} update ($(date -u +%F))"
          # Someone else may have pushed while this job ran: rebase onto it and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done
          exit 1
