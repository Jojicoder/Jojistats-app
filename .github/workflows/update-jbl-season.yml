name: Update JBL Season JSON

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-jbl-season.yml"
      - "docs/jbl-season-json.md"
      - "scripts/validate-jbl-json.mjs"
      - "src/sim/jblJsonTypes.ts"
      - "package.json"
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to export"
        required: true
        default: "2026"
      engine_ref:
        description: "BaseballEngine branch/tag/SHA"
        required: false
        default: "main"
      mode:
        description: "incremental = continue from last exported day, rebuild = regenerate the full season from scratch"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - rebuild
      through:
        description: "incremental only: export games through this date (YYYY-MM-DD). Blank = today."
        required: false
        default: ""
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update-season:
    runs-on: ubuntu-latest

    env:
      SEASON: ${{ inputs.season || '2026' }}
      MODE: ${{ inputs.mode || 'incremental' }}
      THROUGH: ${{ inputs.through }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout BaseballEngine
        uses: actions/checkout@v4
        with:
          repository: Jojicoder/BaseballEngine
          ref: ${{ inputs.engine_ref || 'main' }}
          path: engine

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Build C++ exporters
        working-directory: engine/app
        run: |
          make game-export CXX=g++ CXXFLAGS="-std=c++17 -O2 -Wall -Wextra -Wpedantic -I../include"

      # Push events only validate that the exporter still builds and runs —
      # they write to a scratch directory so a workflow-file tweak can never
      # clobber the real, already-published season data.
      - name: Smoke-test exporter
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)/season-smoke-test"
          engine/build/JojiGameExport --season "${SEASON}" --all-games --limit 3 --out-dir "${TMP_DIR}"
          JBL_JSON_ROOT="${TMP_DIR}" node scripts/validate-jbl-json.mjs "${SEASON}"

      - name: Export season and detailed games
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          OUT_DIR="public/jbl/seasons/${SEASON}"
          mkdir -p "${OUT_DIR}"

          if [ "${MODE}" = "rebuild" ]; then
            engine/build/JojiGameExport --season "${SEASON}" --all-games --out-dir "${OUT_DIR}"
          else
            THROUGH_ARGS=()
            if [ -n "${THROUGH}" ]; then
              THROUGH_ARGS+=(--through "${THROUGH}")
            fi
            engine/build/JojiGameExport --season "${SEASON}" --incremental --out-dir "${OUT_DIR}" "${THROUGH_ARGS[@]}"
          fi

      - name: Validate JBL JSON
        if: github.event_name != 'push'
        run: node scripts/validate-jbl-json.mjs "${SEASON}"

      - name: Build frontend
        run: npm ci && npm run build

      - name: Commit and push JSON update
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "public/jbl/seasons/${SEASON}" || true
          if git diff --staged --quiet; then
            echo "No JBL JSON changes to commit."
            exit 0
          fi
          git commit -m "auto: JBL ${SEASON} update ($(date -u +%F))"
          git push
